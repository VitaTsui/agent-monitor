[package]
name = "am-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "agent-monitor 桌面客户端：本机 AI 代理会话上报 + Tauri 窗口/托盘"

[[bin]]
# 保持可执行名与 .app 的 CFBundleExecutable 一致
name = "agent-monitor"
path = "src/main.rs"

[features]
# 桌面 GUI（窗口 + 托盘）。默认开启；纯后台构建可 --no-default-features。
default = ["desktop"]
desktop = []

[dependencies]
am-core.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
dirs.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true
uuid.workspace = true
reqwest.workspace = true
base64 = "0.22"
# 配置同步：算文件指纹（与 hub 同一版本，差异判定只认哈希不认 mtime）
sha2 = "0.10"
# 监听会话目录：文件一变（用户发了任务）立即扫描上报，不必等被系统节流的轮询定时器
notify = "6"
tauri = { version = "2", features = ["tray-icon"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Security_Cryptography",
    "Win32_System_RestartManager",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# NSProcessInfo.beginActivity 关掉 App Nap（后台托盘态定时器不被系统压到 ~60s）
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString"] }
