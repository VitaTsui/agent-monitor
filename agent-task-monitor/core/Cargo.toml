[package]
name = "am-core"
version = "0.2.0"
edition = "2021"
description = "agent-monitor 共享核心：模型、进程、会话解析"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.30"
dirs = "5"
anyhow = "1"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
