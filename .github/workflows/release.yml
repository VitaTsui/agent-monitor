# 发版：先把三端安装包构建出来，最后一步才创建 Release 并把包一起挂上去。
#
# 顺序是这个工作流的全部要点。以前是「推 main → 立刻 gh release create → 安装包
# 事后由人手动 gh release upload」，于是每次发版都先冒出一个没有任何资产、却被
# 标成 Latest 的空 Release；忘了传（常事）它就一直空着。
#
# 也没有拆成两个工作流用 `release: published` 串起来：GITHUB_TOKEN 创建的 Release
# 不会再触发别的工作流（GitHub 的防递归），那条链在本仓根本不会被点着。
#
# 现在的失败语义：任何一端构建挂了，release 这一步就不会跑 —— 结果是「没有
# Release、工作流标红」，而不是「空 Release 被标成 Latest」。
name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只构建安装包、不创建 Release（用来验证构建链）
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  version:
    name: 版本号
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      skip: ${{ steps.ver.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 打 tag 前要先知道有哪些 tag，浅克隆看不到。
          fetch-depth: 0

      - name: 读取版本号并检查 tag
        id: ver
        run: |
          # 版本号只有一个来源：agent-task-monitor/Cargo.toml 的 [workspace.package]。
          # 两个打包脚本（package-macos.sh / package-windows.sh）读的也是它。
          VERSION=$(awk '
            /^\[workspace\.package\]/ { in_sec = 1; next }
            /^\[/                     { in_sec = 0 }
            in_sec && /^version[[:space:]]*=/ {
              gsub(/[",]/, "", $3); print $3; exit
            }
          ' agent-task-monitor/Cargo.toml)

          if [ -z "$VERSION" ]; then
            echo "::error::没能从 agent-task-monitor/Cargo.toml 的 [workspace.package] 读到版本号"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

          # 手动 dry run 存在的意义就是「只验证构建链」，tag 在不在都得把包编出来；
          # 否则版本号一发出去，这个入口就永远只会跳过、验不了任何东西。
          # 真发版由下面 release 作业的 inputs.dry_run != true 拦着，这里放行不会多发。
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "手动 dry run：只构建、不发布"
          # 版本号没动就重复推 main 是常事，重复发版不是——连构建一起静默跳过。
          elif git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag v$VERSION 已存在，跳过发布"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "将发布 v$VERSION"
          fi

  web:
    name: Web 产物
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-monitor-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # pnpm 版本由 package.json 的 packageManager 固定，不在这里另写一遍。
      - name: 启用 Corepack
        run: corepack enable
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      # .env.prod 不入库（见 .env/.env.prod.example）：两个值要与线上 hub 的
      # AM_CRYPTO_KEY / RSA 私钥配对，属部署配置，由仓库变量注入后现生成。
      - name: 生成 .env.prod
        env:
          CRYPTO_KEY: ${{ vars.WEB_CRYPTO_KEY }}
          RSA_PUB_KEY: ${{ vars.WEB_RSA_PUB_KEY }}
        run: bash scripts/write-env-prod.sh
      - name: 构建
        run: pnpm build
      # dist 不入库，但客户端 tauri::generate_context! 在**编译期**就要读它
      # （tauri.conf.json 的 frontendDist），所以在这里产出、下面两端各自取回。
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: agent-monitor-web/dist
          retention-days: 1
          # dist 里 175 个 vendor chunk 的文件名以点开头（.pnpm-xxx.chunk.js —— 名字取自
          # pnpm 的 node_modules/.pnpm 路径），而 upload-artifact 默认丢掉所有隐藏文件：
          # 不开这个开关，传上去的 dist 只剩 main.js，index.html 引的 chunk 全 404，
          # 而且上传步骤一声不吭地成功。
          include-hidden-files: true

  package:
    name: 安装包 (${{ matrix.target }})
    needs: [version, web]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # 一端挂了不该埋掉另一端的日志；但 release 作业要求 needs 全绿，
      # 所以缺包时不会有 Release 出去。
      fail-fast: false
      matrix:
        include:
          # 一个 universal 包同时覆盖 Apple 芯片与 Intel（package-macos.sh 里 lipo 合的）。
          # 没有拆成 arm64 / x64 两个包：客户端自更新写死去下固定名 agent-monitor-mac.zip
          # （client/src/desktop.rs 的 do_self_update），拆包会让 Intel 机器更新到跑不起来的包。
          - os: macos-latest
            target: macos-universal
          - os: windows-latest
            target: windows-x64
    defaults:
      run:
        shell: bash
        working-directory: agent-task-monitor
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: agent-monitor-web/dist

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent-task-monitor

      # Windows runner 自带 NSIS，但不一定在 PATH 上；缺了就装。
      - name: 准备 NSIS
        if: startsWith(matrix.os, 'windows')
        run: |
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"
          if ! command -v makensis >/dev/null && [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            choco install nsis -y --no-progress
          fi

      - name: 打包 macOS
        if: startsWith(matrix.os, 'macos')
        run: |
          bash scripts/package-macos.sh
          mkdir -p out
          # 这个 zip 里就是完整的 .app（ditto 打的，签名/资源叉都在），
          # 既是应用内自更新用的包，也是能直接下载解压就用的那一个。
          # 资产名沿用 README 里写给用户的那套：agent-monitor-<版本>-<平台>-<架构>。
          cp target/dist/agent-monitor-mac.zip \
            "out/agent-monitor-${{ needs.version.outputs.version }}-macos-universal.zip"

      - name: 打包 Windows
        if: startsWith(matrix.os, 'windows')
        run: |
          rustup target add x86_64-pc-windows-msvc
          bash scripts/package-windows.sh
          mkdir -p out
          # 同上，资产名统一成 README 里的那套；打包脚本产出的
          # AgentMonitor-<版本>-setup.exe 这个名字是部署侧（hub 的 ready_desktop_version）
          # 认的，只在这里改「上传到 Release 用什么名」，不动脚本产物名。
          cp "target/dist/AgentMonitor-${{ needs.version.outputs.version }}-setup.exe" \
            "out/agent-monitor-${{ needs.version.outputs.version }}-windows-x64.exe"

      # README 让用户 `shasum -a 256 -c <包名>.sha256` 校验，校验和得跟包一起出。
      # macOS 只有 shasum、Git Bash 只有 sha256sum，两个都试一遍。
      - name: 生成 sha256
        run: |
          cd out
          for f in *; do
            case "$f" in *.sha256) continue;; esac
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target }}
          path: agent-task-monitor/out/*
          if-no-files-found: error

  release:
    name: 打 tag 并发布
    needs: [version, package]
    if: needs.version.outputs.skip != 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 落在 release-assets/ 而不是 assets/：本仓根目录**本来就有** assets/
      # （图标源文件 assets/brand/），上一步的 checkout 已经把它铺在工作区里。
      # 下载到同名目录会把两者混在一起，下面的 `release-assets/*` 就会 glob 到
      # assets/brand 这个目录，gh 上传目录直接报 `read assets/brand: is a directory`
      # 并让整个 release 作业失败（0.11.59 首次实际跑到这一步时就是这么挂的：
      # 0.11.57/0.11.58 一个走 dry_run、一个 tag 已存在被 skip，都没真正执行过）。
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
          path: release-assets

      - name: 创建 Release 并挂上安装包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la release-assets
          # tag 在这一刻才打：前面任一端没构建出包，这一步压根不会执行，
          # 于是不会留下一个空的 Latest。
          gh release create "${{ needs.version.outputs.tag }}" \
            --generate-notes \
            --target "${{ github.sha }}" \
            --latest \
            release-assets/*
