name: CI

on:
  push:
    branches:
      - develop
      - main
      - "[0-9]+.x"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-monitor-web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # pnpm 版本由 package.json 的 packageManager 固定，不在这里另写一遍。
      - name: 启用 Corepack
        run: corepack enable

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # .env.prod 不入库（见 .env/.env.prod.example）；生产构建必须先把它生成出来，
      # 否则 vite.config.ts 读不到文件、直接报缺文件退出。
      - name: 生成 .env.prod
        env:
          CRYPTO_KEY: ${{ vars.WEB_CRYPTO_KEY }}
          RSA_PUB_KEY: ${{ vars.WEB_RSA_PUB_KEY }}
        run: bash scripts/write-env-prod.sh

      - name: 构建
        run: pnpm build

      # dist 不入库，但桌面客户端编译期就要读它（见下面 rust job 的说明），
      # 所以在这里把产物传下去，而不是让每个平台各自再装一遍前端依赖。
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: agent-monitor-web/dist
          retention-days: 1
          # upload-artifact 默认丢掉所有隐藏文件，而且丢完仍报成功 —— 桌面客户端
          # 因此拿到过引用 404 的残缺 dist。产物侧已经在 vite.config.ts 的
          # chunkFileNames 里削掉了前导点（rolldown 的 CJS 互操作模块本名就叫
          # `.esm-wrapper`），这个开关留着当第二道保险：将来任何一个点开头的产物
          # 都不会再被静默吞掉。
          include-hidden-files: true

  rust:
    name: Rust (${{ matrix.os }})
    needs: web
    runs-on: ${{ matrix.os }}
    # 卡住的一步应该花几分钟，而不是 GitHub 默认放行的六小时。
    timeout-minutes: 60
    strategy:
      # 三个平台各自可用，一个挂了不该埋掉另外两个的结论。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: agent-task-monitor
    steps:
      - uses: actions/checkout@v7

      # client/src/desktop.rs 的 tauri::generate_context! 在**编译期**读
      # tauri.conf.json 的 frontendDist（../../agent-monitor-web/dist）。
      # 目录不存在就编不过，所以先把 web job 的产物放回原位。
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: agent-monitor-web/dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent-task-monitor

      # Tauri 在 Linux 上要 webkit2gtk 才编得动。
      # `-y` 只回答「要不要装」，回答不了 dpkg 装到一半弹出的配置问题——
      # 那些问题在没有终端的 runner 上永远等不到答案，noninteractive 让它们走默认值。
      - name: Linux 构建依赖
        if: startsWith(matrix.os, 'ubuntu')
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf

      # 格式与平台无关，跑一遍就够。
      - name: 格式检查
        if: startsWith(matrix.os, 'ubuntu')
        run: cargo fmt --all -- --check

      # `-D warnings` 把告警升级成错误。不带它的时候 clippy 永远退 0，告警只是滚过日志、
      # 谁也不会去看 —— 这就是为什么曾经一声不吭地攒到 27 条。
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 测试
        run: cargo test --workspace
