<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover 是安全区适配的前提：不加它，WebView 会把
      env(safe-area-inset-*) 全部给 0，CSS 侧再怎么写也补不出刘海/手势条的留白。
      （Android 15 起窗口强制延伸到系统栏下，移动端外壳尤其需要。）
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="" />
    <!-- 引入路径必须为 /to/file/path -->
    <!-- v=2 破 favicon 强缓存（旧访客的标签图标才会刷新） -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48" type="image/x-icon" />
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <meta name="theme-color" content="#0f9bad" />
    <!-- PWA：iPhone Safari「添加到主屏幕」后以独立应用运行 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="任务监控" />
    <script src="/config.js"></script>
    <script>
      // 运行时动态设置标题
      if (window.Config) {
        if (window.Config.title) {
          document.title = window.Config.title;
        }
        if (window.Config.description) {
          document
            .querySelector("meta[name='description']")
            .setAttribute("content", window.Config.description);
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
